<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Quét Mã</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        h1 { font-size: 20px; color: #1f2937; margin-bottom: 20px; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        #status-msg { font-weight: bold; font-size: 18px; padding: 10px; border-radius: 8px; min-height: 25px; transition: 0.3s; }
        .success { background-color: #dcfce7; color: #16a34a; }
        .error { background-color: #fee2e2; color: #dc2626; }
        .idle { background-color: #e5e7eb; color: #4b5563; }
        
        /* Giao diện nhập tay phòng hờ camera mờ */
        .manual-input { margin-top: 20px; display: flex; gap: 10px; }
        .manual-input input { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 16px; outline: none; }
        .manual-input button { padding: 12px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📸 Đưa mã vạch vào khung hình</h1>
        
        <!-- Khu vực hiển thị Camera -->
        <div id="reader"></div>
        
        <!-- Khung báo kết quả -->
        <div id="status-msg" class="idle">Sẵn sàng quét...</div>

        <!-- Khung nhập tay dự phòng -->
        <div class="manual-input">
            <input type="text" id="manual-code" placeholder="Hoặc nhập mã tay..." autocomplete="off">
            <button onclick="sendManualCode()">Gửi</button>
        </div>
    </div>

    <!-- Nhúng thư viện quét mã vạch HTML5 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script>
        const statusMsg = document.getElementById('status-msg');
        let isScanningPaused = false; // Biến chặn quét liên tục 1 mã nhiều lần

        // Hàm bắn API sang Server (Trạm 2)
        async function sendBarcodeToServer(barcode) {
            try {
                const res = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ barcode: barcode })
                });
                
                const data = await res.json();
                
                if (data.status === 'success') {
                    showStatus(`✅ Đã nhận: ${barcode}`, 'success');
                } else {
                    showStatus(`❌ Mã chưa có: ${barcode}`, 'error');
                }
            } catch (err) {
                showStatus(`⚠️ Lỗi mạng!`, 'error');
            }
        }

        // Hàm hiển thị màu sắc trạng thái
        function showStatus(text, type) {
            statusMsg.innerText = text;
            statusMsg.className = type;
            setTimeout(() => {
                statusMsg.innerText = "Sẵn sàng quét...";
                statusMsg.className = "idle";
            }, 2500); // Tự động reset màu sau 2.5 giây
        }

        // Khởi tạo Camera
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { 
                fps: 10, // Quét 10 khung hình/giây
                qrbox: {width: 250, height: 100}, // Vẽ cái khung hình chữ nhật vừa với mã vạch
                aspectRatio: 1.0 
            },
            /* verbose= */ false
        );

        // Chạy khi Camera bắt được mã
        function onScanSuccess(decodedText, decodedResult) {
            if (isScanningPaused) return; // Nếu đang tạm dừng thì bỏ qua
            
            // Tạm dừng camera 2 giây để tránh việc nó bắn 10 lệnh/giây cho cùng 1 cái mã
            isScanningPaused = true; 
            sendBarcodeToServer(decodedText);
            
            setTimeout(() => {
                isScanningPaused = false;
            }, 2000);
        }

        html5QrcodeScanner.render(onScanSuccess);

        // Xử lý gửi mã bằng nút nhập tay
        function sendManualCode() {
            const input = document.getElementById('manual-code');
            const code = input.value.trim();
            if (code) {
                sendBarcodeToServer(code);
                input.value = '';
                input.focus();
            }
        }

        // Bắt phím Enter cho ô nhập tay
        document.getElementById('manual-code').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendManualCode();
        });
    </script>
</body>
</html>
